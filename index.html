function escapeHtml(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function render(keyword="") {
  const k = keyword.trim().toLowerCase();
  body.innerHTML = "";

  const rows = [];
  data.forEach(d => {
    const familyRows = family.filter(f => f[0] === d.name);
    rows.push(d);
    familyRows.forEach((f, i) => {
      rows.push({
        id: "",
        unit: "",
        emp: "",
        name: "↳ " + f[1],
        food: f[2],
        note: "眷屬"
      });
    });
  });

  const filtered = rows.filter(r =>
    Object.values(r).some(v => String(v).toLowerCase().includes(k))
  );

  if (!filtered.length) {
    body.innerHTML = '<tr><td colspan="6" class="empty">找不到符合的資料</td></tr>';
    return;
  }

  filtered.forEach(r => {
    body.innerHTML += `<tr>
      <td>${escapeHtml(r.id)}</td>
      <td>${escapeHtml(r.unit)}</td>
      <td>${escapeHtml(r.emp)}</td>
      <td>${escapeHtml(r.name)}</td>
      <td>${escapeHtml(r.food)}</td>
      <td>${escapeHtml(r.note)}</td>
    </tr>`;
  });
}
